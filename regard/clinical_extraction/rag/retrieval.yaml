# Retrieval configuration (prototype).

vector_store: "placeholder" # e.g. pgvector, pinecone, opensearch
lexical_index: "placeholder" # optional for hybrid

top_k: 8
mmr_lambda: 0.5
hybrid:
  enabled: true
  dense_weight: 0.7
  sparse_weight: 0.3

reranker:
  enabled: false
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

query_rewrite:
  enabled: false
  ab_test_flag: "rag_query_rewrite_2026q2"

filters:
  expose_as_api_params:
    - time_from
    - time_to
    - doc_types
    - encounter_id

operational_targets:
  index_freshness_minutes: 15
  p95_retrieval_latency_ms: 250

# Reported periodically from production / pilot (placeholders for §5.5 operational checklist).
operational_reporting:
  index_size_bytes_per_tenant: null
  p95_retrieval_latency_ms_sampled: null
  embedding_cost_usd_per_1m_tokens: null
  notes: "Populate from billing + APM; compare to operational_targets."
