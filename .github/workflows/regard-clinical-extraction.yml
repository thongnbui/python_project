# Offline tests + dry-run regression for regard/clinical_extraction (no API keys).
name: Regard clinical_extraction

on:
  push:
    paths:
      - "regard/clinical_extraction/**"
      - ".github/workflows/regard-clinical-extraction.yml"
  pull_request:
    paths:
      - "regard/clinical_extraction/**"
      - ".github/workflows/regard-clinical-extraction.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: regard/clinical_extraction/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r regard/clinical_extraction/requirements.txt

      - name: Run pytest (dry-run + baselines; no OPENAI_API_KEY)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest regard/clinical_extraction/tests -q

      - name: Prompt major.minor stress gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python regard/clinical_extraction/evals/scripts/verify_prompt_stress_gate.py
