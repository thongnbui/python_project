version: 2

sources:
  - name: example
    description: "Example upstream tables (see seeds/) for source freshness demos"
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: raw_example_events
        description: "Loaded via dbt seed; used to demonstrate source freshness"
        columns:
          - name: id
            description: "Event id"
          - name: loaded_at
            description: "When the row was available upstream; drives freshness checks"
        config:
          loaded_at_field: loaded_at
          freshness:
            # warn: latest loaded_at older than this vs run time
            warn_after: {count: 7, period: day}
            # error: tighten in prod; widen here so demo seed ages without hard failures
            error_after: {count: 36500, period: day}
